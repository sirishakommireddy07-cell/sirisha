    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('sk-theme');
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
